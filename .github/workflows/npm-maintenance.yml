name: npm maintenance

# One-time repair of npm's default tags and deprecation metadata. Remove this
# workflow after the registry reflects the supported versions below.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-sdk-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Confirm the token authenticates
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Promote the supported core release and clear its warning
        run: |
          set -euo pipefail

          promote() {
            package="$1"
            version="$2"
            npm dist-tag add "$package@$version" latest
            npm deprecate "$package@$version" ""
          }

          promote @hedgents/stablecoin-rail 0.2.2

          npm deprecate @hedgents/stablecoin-rail@0.2.0 "Superseded by 0.2.2. Please upgrade."
          npm deprecate @hedgents/stablecoin-rail@0.2.1 "Superseded by 0.2.2. Please upgrade."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm tag propagation
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if test "$(npm view @hedgents/stablecoin-rail dist-tags.latest)" = "0.2.2"; then
              exit 0
            fi
            sleep 5
          done
          echo "npm tags did not converge before the verification deadline" >&2
          exit 1
