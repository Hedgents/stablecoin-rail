name: npm maintenance

# One-time registry repair for the supported CCTP release. This workflow is
# removed after a successful run so future registry changes stay deliberate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-cctp-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Confirm the token authenticates
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Promote the supported release and repair deprecations
        run: |
          set -euo pipefail
          npm dist-tag add @hedgents/stablecoin-rail-cctp@0.1.3 latest
          npm deprecate @hedgents/stablecoin-rail-cctp@0.1.3 ""
          npm deprecate @hedgents/stablecoin-rail-cctp@0.1.0 "Superseded by 0.1.3. Please upgrade."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify registry state
        run: |
          test "$(npm view @hedgents/stablecoin-rail-cctp dist-tags.latest)" = "0.1.3"
          test "$(npm view @hedgents/stablecoin-rail-cctp dist-tags.alpha)" = "0.1.3"
          test -z "$(npm view @hedgents/stablecoin-rail-cctp@0.1.3 deprecated || true)"
